name: Guard engineering-system changes

on:
  pull_request:

permissions:
  contents: read

jobs:
  engineering-policy:
    name: Guard engineering-system changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check engineering-system policy
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf '%s\n' "${changed[@]}"

          engineering=()
          for file in "${changed[@]}"; do
            if [[ "$file" == .github/workflows/* || "$file" == build/* || "$file" == package.json || "$file" == */package.json ]]; then
              engineering+=("$file")
            fi
          done

          if [[ ${#engineering[@]} -eq 0 ]]; then
            echo "No engineering-system files changed."
            exit 0
          fi

          echo "Changed engineering-system files:"
          printf ' - %s\n' "${engineering[@]}"

          case "$AUTHOR_ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR)
              echo "Authorized repository collaborator ($AUTHOR_LOGIN / $AUTHOR_ASSOCIATION); allowing engineering-system changes."
              ;;
            *)
              echo "Engineering-system changes require a repository owner/member/collaborator."
              exit 1
              ;;
          esac
