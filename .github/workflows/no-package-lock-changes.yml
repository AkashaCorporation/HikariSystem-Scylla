name: Guard dependency lockfiles

on:
  pull_request:

permissions:
  contents: read

jobs:
  lockfile-policy:
    name: Guard dependency lockfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check lockfile policy
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
      run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf '%s\n' "${changed[@]}"

          lockfiles=()
          for file in "${changed[@]}"; do
            if [[ "$file" == *package-lock.json || "$file" == *Cargo.lock ]]; then
              lockfiles+=("$file")
            fi
          done

          if [[ ${#lockfiles[@]} -eq 0 ]]; then
            echo "No dependency lockfiles changed."
            exit 0
          fi

          echo "Changed dependency lockfiles:"
          printf ' - %s\n' "${lockfiles[@]}"

          case "$AUTHOR_ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR)
              echo "Authorized repository collaborator ($AUTHOR_LOGIN / $AUTHOR_ASSOCIATION); allowing lockfile changes."
              ;;
            *)
              if [[ "$AUTHOR_LOGIN" == "dependabot[bot]" ]]; then
                echo "Dependabot lockfile update allowed."
              else
                echo "Lockfile changes require a repository owner/member/collaborator."
                exit 1
              fi
              ;;
          esac
