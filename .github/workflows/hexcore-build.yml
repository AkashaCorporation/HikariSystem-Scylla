name: Scylla CI

on:
  push:
    branches:
      - main
      - "scylla/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  VSCODE_SKIP_NODE_VERSION_CHECK: 1
  npm_config_maxsockets: 8
  npm_config_loglevel: warn

jobs:
  build-scylla-extensions:
    name: Compile Scylla Extensions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.21.1"

      - name: Environment
        run: |
          node --version
          npm --version

      - name: Scylla preflight
        run: node scripts/verify-scylla-preflight.cjs

      - name: Compile all Scylla extensions
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          built=0
          for dir in extensions/scylla-*; do
            if [[ ! -f "$dir/package.json" ]]; then
              continue
            fi

            echo "::group::${dir}"
            pushd "$dir" >/dev/null

            if [[ -f package-lock.json ]]; then
              npm ci --ignore-scripts
            else
              echo "::warning file=${dir}/package.json::No package-lock.json found; using npm install for CI fallback."
              npm install --ignore-scripts
            fi

            if node -e "const p=require('./package.json'); process.exit(p.scripts?.compile ? 0 : 1)"; then
              npm run compile
              built=$((built + 1))
            else
              echo "No compile script; manifest-only extension."
            fi

            popd >/dev/null
            echo "::endgroup::"
          done

          if [[ "$built" -eq 0 ]]; then
            echo "No Scylla TypeScript extensions were compiled."
            exit 1
          fi

          echo "Compiled ${built} Scylla extensions."

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Scylla CI"
            echo
            echo "- Node: 22.21.1"
            echo "- Shared preflight: attempted"
            echo "- Scylla extension compilation: attempted"
          } >> "$GITHUB_STEP_SUMMARY"
