name: Scylla CI

on:
  push:
    branches:
      - main
      - "scylla/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  VSCODE_SKIP_NODE_VERSION_CHECK: 1
  npm_config_maxsockets: 8
  npm_config_loglevel: warn

jobs:
  build-scylla-extensions:
    name: Compile Scylla Extensions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.21.1"

      - name: Environment
        run: |
          node --version
          npm --version

      - name: Compile all Scylla extensions
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          built=0
          for dir in extensions/scylla-*; do
            if [[ ! -f "$dir/package.json" ]]; then
              continue
            fi

            echo "::group::${dir}"
            pushd "$dir" >/dev/null

            if [[ -f package-lock.json ]]; then
              npm ci --ignore-scripts
            else
              echo "::warning file=${dir}/package.json::No package-lock.json found; using npm install for CI fallback."
              npm install --ignore-scripts
            fi

            if node -e "const p=require('./package.json'); process.exit(p.scripts?.compile ? 0 : 1)"; then
              npm run compile
              built=$((built + 1))
            else
              echo "No compile script; manifest-only extension."
            fi

            popd >/dev/null
            echo "::endgroup::"
          done

          if [[ "$built" -eq 0 ]]; then
            echo "No Scylla TypeScript extensions were compiled."
            exit 1
          fi

          echo "Compiled ${built} Scylla extensions."

      - name: Validate Scylla job examples
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=(docs/jobs/*.scylla_job.json)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No Scylla job examples found."
            exit 1
          fi

          node - "${files[@]}" <<'NODE'
          const fs = require('fs');
          const files = process.argv.slice(2);
          let failed = false;

          for (const file of files) {
            try {
              const job = JSON.parse(fs.readFileSync(file, 'utf8'));
              if (typeof job.target !== 'string' || !job.target) throw new Error('missing target');
              if (typeof job.outDir !== 'string' || !job.outDir) throw new Error('missing outDir');
              if (!Array.isArray(job.steps) || job.steps.length === 0) throw new Error('missing steps');
              for (const [index, step] of job.steps.entries()) {
                if (!step || typeof step.cmd !== 'string' || !step.cmd) {
                  throw new Error(`step ${index + 1} is missing cmd`);
                }
              }
              console.log(`OK ${file} (${job.steps.length} steps)`);
            } catch (error) {
              failed = true;
              console.error(`FAIL ${file}: ${error.message}`);
            }
          }

          if (failed) process.exit(1);
          NODE

      - name: Verify Engagement commands are job-capable
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('extensions/scylla-engagements/package.json', 'utf8'));
          const runner = fs.readFileSync('extensions/scylla-jobs/src/pipelineRunner.ts', 'utf8');
          const commands = (pkg.contributes?.commands ?? []).map(x => x.command).filter(Boolean);
          const missing = commands.filter(command => !runner.includes(`['${command}'`));

          if (missing.length) {
            console.error('Engagement commands missing from Scylla Jobs capability registry:');
            for (const command of missing) console.error(` - ${command}`);
            process.exit(1);
          }

          console.log(`All ${commands.length} Scylla Engagement commands are registered in Scylla Jobs.`);
          NODE

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Scylla CI"
            echo
            echo "- Node: 22.21.1"
            echo "- Scylla extension compilation: attempted"
            echo "- Job example validation: attempted"
            echo "- Engagement → Jobs command coverage: attempted"
          } >> "$GITHUB_STEP_SUMMARY"
