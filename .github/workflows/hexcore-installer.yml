name: Scylla Windows Build

on:
  push:
    branches:
      - "scylla/**"
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

env:
  VSCODE_SKIP_NODE_VERSION_CHECK: 1
  npm_config_maxsockets: 8
  npm_config_loglevel: warn

concurrency:
  group: scylla-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Scylla Windows ZIP
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.21.1"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Environment
        shell: pwsh
        run: |
          node --version
          npm --version
          python --version

      - name: Scylla preflight
        shell: pwsh
        run: node scripts/verify-scylla-preflight.cjs

      - name: Install global build tools
        shell: pwsh
        run: npm install -g node-gyp gulp-cli tsx prebuild-install

      - name: Install build gyp dependencies
        shell: pwsh
        run: npm --prefix build/npm/gyp ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install build dependencies
        shell: pwsh
        run: |
          Push-Location build
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "build/npm ci failed with exit code $LASTEXITCODE" }
          Pop-Location
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bootstrap Code-OSS and local extensions
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "root npm ci failed with exit code $LASTEXITCODE" }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: 0
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      # The Scylla snapshot still contains the legacy HexCore SQLite wrapper,
      # but IOC storage now treats it as optional and falls back to memory in
      # auto mode. Do not install/build the stale native wrapper here; it is
      # intentionally deferred until the 2.0.3+ engine is synchronized from
      # HikariSystem-HexCore.

      - name: Compile Scylla extensions
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $built = 0
          $extensions = Get-ChildItem extensions -Directory -Filter "scylla-*" | Sort-Object Name
          foreach ($entry in $extensions) {
            $dir = $entry.FullName
            $manifest = Join-Path $dir "package.json"
            if (-not (Test-Path $manifest)) { continue }

            Write-Host "::group::$($entry.Name)"
            Push-Location $dir
            try {
              if (Test-Path "package-lock.json") {
                npm ci --ignore-scripts
                if ($LASTEXITCODE -ne 0) { throw "npm ci failed for $($entry.Name) with exit code $LASTEXITCODE" }
              } else {
                npm install --ignore-scripts
                if ($LASTEXITCODE -ne 0) { throw "npm install failed for $($entry.Name) with exit code $LASTEXITCODE" }
              }

              $compile = node -p "Boolean(require('./package.json').scripts?.compile)"
              if ($LASTEXITCODE -ne 0) { throw "Could not inspect compile script for $($entry.Name)" }
              if ($compile.Trim() -eq "true") {
                npm run compile
                if ($LASTEXITCODE -ne 0) { throw "TypeScript compile failed for $($entry.Name) with exit code $LASTEXITCODE" }
                $built++
              } else {
                Write-Host "No compile script; manifest/assets-only extension."
              }
            } finally {
              Pop-Location
              Write-Host "::endgroup::"
            }
          }

          if ($built -eq 0) {
            throw "No Scylla extension compile scripts were executed."
          }
          Write-Host "Compiled $built Scylla extensions."

      - name: Compile retained HexCore utility extensions
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $utilities = @(
            "hexcore-base64",
            "hexcore-common",
            "hexcore-filetype",
            "hexcore-hashcalc",
            "hexcore-ioc",
            "hexcore-strings",
            "hexcore-yara"
          )

          foreach ($name in $utilities) {
            $dir = Join-Path "extensions" $name
            if (-not (Test-Path "$dir/package.json")) {
              Write-Host "Skipping absent retained utility: $name"
              continue
            }

            Write-Host "::group::$name"
            Push-Location $dir
            try {
              if (Test-Path "package-lock.json") {
                npm ci --ignore-scripts
                if ($LASTEXITCODE -ne 0) { throw "npm ci failed for $name with exit code $LASTEXITCODE" }
              } else {
                npm install --ignore-scripts
                if ($LASTEXITCODE -ne 0) { throw "npm install failed for $name with exit code $LASTEXITCODE" }
              }
              $compile = node -p "Boolean(require('./package.json').scripts?.compile)"
              if ($LASTEXITCODE -ne 0) { throw "Could not inspect compile script for $name" }
              if ($compile.Trim() -eq "true") {
                npm run compile
                if ($LASTEXITCODE -ne 0) { throw "TypeScript compile failed for $name with exit code $LASTEXITCODE" }
              }
            } finally {
              Pop-Location
              Write-Host "::endgroup::"
            }
          }

      - name: Build Scylla Code-OSS
        shell: pwsh
        run: |
          # Node 22.21's native TypeScript stripping rejects an upstream-style
          # gulpfile.extensions.ts construct that tsx/esbuild handles correctly.
          # Run gulp under tsx so the Code-OSS build uses a real TS loader.
          tsx ./node_modules/gulp/bin/gulp.js vscode-win32-x64-min
          if ($LASTEXITCODE -ne 0) { throw "Scylla Code-OSS build failed with exit code $LASTEXITCODE" }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify packaged Scylla
        shell: pwsh
        run: |
          $appRoot = "../VSCode-win32-x64/resources/app"
          $productPath = Join-Path $appRoot "product.json"
          if (-not (Test-Path $productPath)) {
            throw "Packaged product.json not found at $productPath"
          }

          $product = Get-Content $productPath -Raw | ConvertFrom-Json
          if ($product.nameShort -ne "Scylla") {
            throw "Unexpected packaged product name: $($product.nameShort)"
          }
          if ($product.applicationName -ne "scylla") {
            throw "Unexpected packaged applicationName: $($product.applicationName)"
          }

          $requiredExtensions = @(
            "scylla-auth",
            "scylla-engagements",
            "scylla-findings",
            "scylla-http",
            "scylla-jobs",
            "scylla-scanner"
          )
          foreach ($extension in $requiredExtensions) {
            $manifest = Join-Path $appRoot "extensions/$extension/package.json"
            if (-not (Test-Path $manifest)) {
              throw "Required packaged extension missing: $extension"
            }
            Write-Host "Packaged extension OK: $extension"
          }

      - name: Create Scylla ZIP archive
        shell: pwsh
        run: |
          $zip = "Scylla-win32-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "../VSCode-win32-x64/*" -DestinationPath $zip -CompressionLevel Optimal
          $sizeMb = [math]::Round((Get-Item $zip).Length / 1MB, 2)
          Write-Host "Created $zip ($sizeMb MB)"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scylla-win32-x64
          path: Scylla-win32-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload ZIP to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: Scylla-win32-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build summary
        if: always()
        shell: pwsh
        run: |
          @"
          ## Scylla Windows Build

          - Runner: windows-2022
          - Node: 22.21.1
          - Shared preflight: attempted
          - Artifact: Scylla-win32-x64.zip
          - Scylla extension compile: enforced
          - IOC SQLite backend: deferred; auto mode uses memory fallback
          - Code-OSS TypeScript loader: tsx
          - Code-OSS package verification: attempted
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY
